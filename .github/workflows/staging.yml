name: Staging Release

on:
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      EDITORIAL_API_TOKEN: ${{ secrets.STAGING_EDITORIAL_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate governed Atlas data
        run: |
          npm run data:atlas:check
          npm run data:reconcile:check
          npm run data:manifest:check

      - name: Migrate and seed staging database
        if: env.DATABASE_URL != ''
        run: |
          npm run db:migrate
          npm run db:seed
          npm run data:reconcile:publish

      - name: Record missing database configuration
        if: env.DATABASE_URL == ''
        run: echo "Database publishing skipped because STAGING_DATABASE_URL is not configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Build and verify staging artifact
        run: npm run staging:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Atlas acceptance tests
        run: npx playwright test tests/e2e/election-atlas.spec.ts tests/e2e/atlas-acceptance.spec.ts

      - name: Upload immutable staging candidate
        uses: actions/upload-artifact@v4
        with:
          name: politik-staging-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Check staging deployment credentials
        id: credentials
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Staging deployment skipped: Vercel secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pull Vercel preview environment
        if: steps.credentials.outputs.available == 'true'
        run: npx vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel preview
        if: steps.credentials.outputs.available == 'true'
        run: npx vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Publish staging preview
        if: steps.credentials.outputs.available == 'true'
        run: |
          DEPLOYMENT_URL=$(npx vercel@56.4.1 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Staging: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
