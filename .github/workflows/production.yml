name: Production Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EDITORIAL_API_TOKEN: ${{ secrets.PRODUCTION_EDITORIAL_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release data and artifact
        run: |
          npm run data:atlas:check
          npm run data:reconcile:check
          npm run data:manifest:check
          npm run staging:check

      - name: Verify deployment credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$DATABASE_URL"
          test -n "$EDITORIAL_API_TOKEN"

      - name: Migrate and seed production publishing store
        run: |
          npm run db:migrate
          npm run db:seed
          npm run data:reconcile:publish

      - name: Build provider artifact
        run: |
          npx vercel@56.4.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@56.4.1 build --prod --token="$VERCEL_TOKEN"

      - name: Publish immutable production release
        id: deploy
        run: |
          DEPLOYMENT_URL=$(npx vercel@56.4.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production health
        run: |
          curl --fail --retry 6 --retry-all-errors --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/health"
          curl --fail --retry 6 --retry-all-errors --retry-delay 5 "${{ steps.deploy.outputs.url }}/peta?jenis=pru&edisi=15&mod=pemenang"
