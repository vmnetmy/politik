name: Production CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: npm ci

      - name: Install data-pipeline dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint source
        run: npm run lint

      - name: Run unit and accessibility tests
        run: npm run test

      - name: Run PDF extraction fixture tests
        run: npm run test:python

      - name: Validate seating extraction
        run: npm run data:seating:check

      - name: Validate voter-age extraction
        run: npm run data:voter-age:check

      - name: Validate cross-election voter-roll extraction
        run: npm run data:voter-roll:check

      - name: Validate scoresheet extraction
        run: npm run data:scoresheets:check

      - name: Cross-check PRU-15 against official SPR Open Data
        run: npm run data:spr-pru15:check

      - name: Validate SPR geography extraction
        run: npm run data:geography:check

      - name: Validate archived DPT locality extraction
        run: npm run data:localities:check

      - name: Validate coverage and boundary governance
        run: npm run data:coverage:check

      - name: Validate official election boundaries
        run: npm run data:boundaries:check

      - name: Validate national election atlas boundaries
        run: npm run data:atlas:check

      - name: Validate SPR state-election extraction
        run: npm run data:state-elections:check

      - name: Validate federal-election extraction
        run: npm run data:federal-elections:check

      - name: Validate cross-election person registry
        run: npm run data:persons:check

      - name: Reconcile election aggregates and source records
        run: npm run data:reconcile:check

      - name: Validate published data integrity manifest
        run: npm run data:manifest:check

      - name: Build production application
        run: npm run build

  browser-quality:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Run responsive browser contracts
        run: npm run test:e2e

      - name: Find latest approved main visual baseline
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              status: "completed",
              per_page: 10,
            });
            const previous = response.data.workflow_runs.find((run) => run.conclusion === "success" && run.id !== context.runId);
            core.setOutput("run-id", previous?.id ?? "");

      - name: Download approved visual baseline
        if: steps.baseline.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: visual-baseline
          path: visual-baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare responsive visual baseline
        if: steps.baseline.outputs.run-id != ''
        run: npm run test:visual

      - name: Record first visual baseline
        if: steps.baseline.outputs.run-id == ''
        run: echo "No successful main baseline exists yet; this run seeds it." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Lighthouse budgets
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/politik-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          run_lighthouse_gate() {
            local target="$1"
            local output="$2"
            local stem="${output%.json}"
            for audit_attempt in 1 2 3; do
              if LIGHTHOUSE_URL="$target" LIGHTHOUSE_OUTPUT="${stem}-attempt-${audit_attempt}.json" npm run lighthouse; then
                cp "${stem}-attempt-${audit_attempt}.json" "$output"
                return 0
              fi
              echo "Lighthouse attempt ${audit_attempt} did not meet the unchanged budgets; retrying with a fresh browser sample."
            done
            return 1
          }
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/pru/15/negeri/parlimen >/dev/null; then
              run_lighthouse_gate "http://127.0.0.1:4173/pru/15/negeri/parlimen" "lighthouse-report.json"
              run_lighthouse_gate "http://127.0.0.1:4173/peta?jenis=pru&edisi=15&mod=pemenang" "lighthouse-atlas-report.json"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/politik-preview.log
          exit 1

      - name: Upload browser quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            lighthouse-report.json
            lighthouse-atlas-report.json
            lighthouse-*-attempt-*.json
            visual-diff/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload responsive visual baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline
          path: visual-current/*.png
          if-no-files-found: error
          retention-days: 30
